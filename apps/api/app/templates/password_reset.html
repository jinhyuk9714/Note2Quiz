{% extends "base.html" %}
{% block content %}
<h2>비밀번호 재설정</h2>
<p>{{ display_name }}님, 비밀번호 재설정을 요청하셨습니다.</p>
<p>아래 버튼을 클릭하여 새 비밀번호를 설정해 주세요.</p>
<p style="text-align: center; margin: 28px 0;">
  <a href="{{ reset_url }}" class="btn">비밀번호 재설정</a>
</p>
<p style="font-size: 13px; color: #888;">
  이 링크는 {{ expire_minutes }}분 후에 만료됩니다.<br>
  요청하지 않으셨다면 이 이메일을 무시해 주세요.
</p>
{% endblock %}
