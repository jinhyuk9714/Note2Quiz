[project]
name = "quiznote-api"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.110",
  "uvicorn[standard]>=0.27",
  "pydantic>=2.6",
  "pydantic-settings>=2.1",
  "sqlalchemy[asyncio]>=2.0",
  "asyncpg>=0.29",
  "alembic>=1.13",
  "anthropic>=0.40",
  "python-multipart>=0.0.9",
  "bcrypt>=4.1",
  "PyJWT>=2.8",
  "pymupdf>=1.24",
]

[project.optional-dependencies]
dev = [
  "ruff>=0.5",
  "pyright>=1.1",
  "pytest>=8.0",
  "pytest-asyncio>=0.24",
  "httpx>=0.27",
  "aiosqlite>=0.20",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pyright]
typeCheckingMode = "strict"
reportMissingTypeStubs = "none"
pythonVersion = "3.11"
venvPath = "."
venv = ".venv"
exclude = ["**/.venv", "**/__pycache__", "**/alembic"]
